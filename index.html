<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box2D Physics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f13;
    color: #e8e4d9;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 {
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #5a9;
    margin-bottom: 16px;
  }
  canvas {
    display: block;
    border: 1px solid #2a2a35;
    background: #12121a;
    cursor: crosshair;
    border-radius: 4px;
  }
  .stats {
    display: flex;
    gap: 24px;
    margin-top: 12px;
    font-size: 12px;
    color: #555;
    letter-spacing: 0.1em;
  }
  .stats span { color: #7bc; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
    justify-content: center;
    max-width: 700px;
  }
  button {
    background: transparent;
    border: 1px solid #2a2a35;
    color: #9ab;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #1e1e28; border-color: #4a6a7a; }
  button:active { transform: scale(0.97); }
  label {
    font-size: 12px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.08em;
  }
  label span { color: #7bc; min-width: 30px; }
  input[type=range] {
    -webkit-appearance: none;
    width: 90px;
    height: 2px;
    background: #2a2a35;
    outline: none;
    border-radius: 1px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #5a9;
    cursor: pointer;
  }
  .hint {
    margin-top: 10px;
    font-size: 11px;
    color: #333;
    letter-spacing: 0.05em;
  }
  .shape-btn { font-size:12px; }
  .shape-btn.active { border-color:#5a9; color:#5a9; }
  input[type=range]:disabled { opacity:0.3; pointer-events:none; }
  canvas.delete-mode { cursor: not-allowed; }
</style>
</head>
<body>
<h1>Box2D &mdash; Simple Physics</h1>
<canvas id="c" width="700" height="440"></canvas>
<div class="stats">
  BODIES: <span id="cnt">0</span> &nbsp;|&nbsp;
  GRAVITY: <span id="grav-out">9.8</span> m/s² &nbsp;|&nbsp;
  BOUNCE: <span id="res-out">0.40</span>
</div>
<div class="controls" style="margin-bottom:6px;">
  <span style="font-size:12px;color:#555;letter-spacing:.1em;">SHAPE</span>
  <button class="shape-btn active" data-shape="box">BOX</button>
  <button class="shape-btn" data-shape="circle">CIRCLE</button>
  <button class="shape-btn" data-shape="rect">RECT</button>
  <button class="shape-btn" data-shape="static-rect">STATIC RECT</button>
  <button class="shape-btn" data-shape="static-circle">STATIC CIRCLE</button>
</div>
<div class="controls">
  <button id="btn-spawn">+ SPAWN</button>
  <button id="btn-delete">DELETE</button>
  <button id="btn-clear">CLEAR</button>
  <button id="btn-pause">PAUSE</button>
  <button id="btn-debug">HITBOX</button>
  <label>WIDTH <input type="range" id="sizeW" min="0.1" max="1.5" step="0.05" value="0.35"> <span id="sizeW-sl">0.35</span></label>
  <label>HEIGHT <input type="range" id="sizeH" min="0.1" max="1.5" step="0.05" value="0.35"> <span id="sizeH-sl">0.35</span></label>
  <label>GRAVITY <input type="range" id="grav" min="0" max="30" step="1" value="9.8"> <span id="grav-sl">9.8</span></label>
  <label>BOUNCE <input type="range" id="res" min="0" max="1" step="0.05" value="0.4"> <span id="res-sl">0.40</span></label>
  <label>FRICTION <input type="range" id="fric" min="0" max="1" step="0.05" value="0.5"> <span id="fric-sl">0.50</span></label>
</div>
<p class="hint">click canvas to spawn &bull; drag bodies to fling &bull; max 80 bodies</p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let gravity = 9.8, restitution = 0.4, friction = 0.5, paused = false;
const SCALE = 60;
const bodies = [];

const px = m => m * SCALE;
const mt = p => p / SCALE;

class Vec2 {
  constructor(x=0,y=0){this.x=x;this.y=y;}
  add(v){return new Vec2(this.x+v.x,this.y+v.y);}
  sub(v){return new Vec2(this.x-v.x,this.y-v.y);}
  scale(s){return new Vec2(this.x*s,this.y*s);}
  dot(v){return this.x*v.x+this.y*v.y;}
  len(){return Math.sqrt(this.x*this.x+this.y*this.y);}
  norm(){const l=this.len();return l>0?this.scale(1/l):new Vec2();}
}

class Body {
  constructor(x,y,type='box',w=0.5,h=0.5){
    this.pos=new Vec2(x,y);
    this.vel=new Vec2();
    this.type=type;
    this.w=w; this.h=h;
    this.r=type==='circle'?w:Math.min(w,h)/2;
    this.angle=0; this.omega=0;
    this.mass=type==='circle'?Math.PI*w*w*10:w*h*10;
    this.invMass=this.mass>0?1/this.mass:0;
    this.inertia=type==='circle'?0.5*this.mass*w*w:this.mass*(w*w+h*h)/12;
    this.invInertia=this.inertia>0?1/this.inertia:0;
    this.isStatic=false;
    this.hue=Math.random()*360;
  }
}

function staticBody(x,y,w,h){
  const b=new Body(x,y,'box',w,h);
  b.isStatic=true; b.mass=0; b.invMass=0; b.invInertia=0;
  return b;
}

// floor + walls
bodies.push(
  staticBody(mt(W/2), mt(H)-0.15, mt(W)-0.2, 0.3),
  staticBody(0.15, mt(H/2), 0.3, mt(H)),
  staticBody(mt(W)-0.15, mt(H/2), 0.3, mt(H))
);

let spawnW=0.35, spawnH=0.35, selectedShape='box';
function spawnAt(x,y,shape){
  shape=shape||selectedShape;
  let b;
  if(shape==='circle'){
    b=new Body(x,y,'circle',spawnW,spawnW);
    b.omega=(Math.random()-0.5)*4;
  } else if(shape==='rect'){
    b=new Body(x,y,'box',spawnW,spawnH);
    b.omega=(Math.random()-0.5)*4;
  } else if(shape==='static-rect'){
    b=staticBody(mt(W/2),mt(H/2),spawnW,spawnH);
  } else if(shape==='static-circle'){
    b=new Body(mt(W/2),mt(H/2),'circle',spawnW,spawnW);
    b.isStatic=true; b.mass=0; b.invMass=0; b.invInertia=0;
  } else { // box (square)
    b=new Body(x,y,'box',spawnW,spawnW);
    b.omega=(Math.random()-0.5)*4;
  }
  bodies.push(b);
}
// keep old names for button compat
function spawnBox(x,y){spawnAt(x,y,'box');}
function spawnCircle(x,y){spawnAt(x,y,'circle');}

function getAABB(b){
  if(b.type==='circle')return{minX:b.pos.x-b.r,maxX:b.pos.x+b.r,minY:b.pos.y-b.r,maxY:b.pos.y+b.r};
  const c=Math.cos(b.angle),s=Math.sin(b.angle),hw=b.w/2,hh=b.h/2;
  const dx=Math.abs(c*hw)+Math.abs(s*hh),dy=Math.abs(s*hw)+Math.abs(c*hh);
  return{minX:b.pos.x-dx,maxX:b.pos.x+dx,minY:b.pos.y-dy,maxY:b.pos.y+dy};
}

function rotVerts(b){
  const hw=b.w/2,hh=b.h/2,c=Math.cos(b.angle),s=Math.sin(b.angle);
  return[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]]
    .map(([vx,vy])=>new Vec2(b.pos.x+c*vx-s*vy,b.pos.y+s*vx+c*vy));
}

// circleCircle removed: using compound rect hitboxes

function satBoxBox(a,b){
  const va=rotVerts(a),vb=rotVerts(b),axes=[];
  for(let i=0;i<4;i++){const e=va[(i+1)%4].sub(va[i]);axes.push(new Vec2(-e.y,e.x).norm());}
  for(let i=0;i<4;i++){const e=vb[(i+1)%4].sub(vb[i]);axes.push(new Vec2(-e.y,e.x).norm());}
  let minPen=Infinity,bestAxis=null;
  for(const ax of axes){
    let minA=Infinity,maxA=-Infinity,minB=Infinity,maxB=-Infinity;
    for(const v of va){const p=ax.dot(v);minA=Math.min(minA,p);maxA=Math.max(maxA,p);}
    for(const v of vb){const p=ax.dot(v);minB=Math.min(minB,p);maxB=Math.max(maxB,p);}
    const ov=Math.min(maxA,maxB)-Math.max(minA,minB);
    if(ov<=0)return null;
    if(ov<minPen){minPen=ov;bestAxis=ax;}
  }
  if(!bestAxis)return null;
  if(b.pos.sub(a.pos).dot(bestAxis)<0)bestAxis=bestAxis.scale(-1);
  const cp=[];
  for(const v of vb){let inside=true;for(let i=0;i<4;i++){const e=va[(i+1)%4].sub(va[i]);if(new Vec2(-e.y,e.x).dot(v.sub(va[i]))<0){inside=false;break;}}if(inside)cp.push(v);}
  for(const v of va){let inside=true;for(let i=0;i<4;i++){const e=vb[(i+1)%4].sub(vb[i]);if(new Vec2(-e.y,e.x).dot(v.sub(vb[i]))<0){inside=false;break;}}if(inside)cp.push(v);}
  if(!cp.length)cp.push(a.pos.add(b.pos).scale(0.5));
  return{n:bestAxis,pen:minPen,contacts:cp};
}

// --- Analytic circle collision (exact, no slab approximation) ---

// n points FROM a TOWARD b (so resolver pushes a back, b forward)
function circleCircle(a,b){
  const d=b.pos.sub(a.pos), dist=d.len(), minD=a.r+b.r;
  if(dist>=minD||dist<1e-9)return null;
  const n=d.scale(1/dist);
  return{n, pen:minD-dist, contacts:[a.pos.add(n.scale(a.r))]};
}

// n points FROM circ TOWARD box
function circleBox(circ,box){
  // transform circle centre into box-local space (unrotated)
  const cosA=Math.cos(-box.angle), sinA=Math.sin(-box.angle);
  const d=circ.pos.sub(box.pos);
  const lx= cosA*d.x - sinA*d.y;
  const ly= sinA*d.x + cosA*d.y;
  const hw=box.w/2, hh=box.h/2;
  // closest point on box to circle centre, in local space
  const cx=Math.max(-hw,Math.min(hw,lx));
  const cy=Math.max(-hh,Math.min(hh,ly));
  const inside=(Math.abs(lx)<hw && Math.abs(ly)<hh);
  // delta from circle centre to closest point (local)
  const dx=cx-lx, dy=cy-ly;
  const dist=Math.sqrt(dx*dx+dy*dy);

  let nx,ny,pen;
  if(inside){
    // circle centre is inside box: push out via shallowest face
    // n must point FROM circ TOWARD box interior exit = outward box normal
    const ox=hw-Math.abs(lx), oy=hh-Math.abs(ly);
    if(ox<oy){ nx=(lx<0?-1:1); ny=0;  pen=circ.r+ox; }
    else      { nx=0; ny=(ly<0?-1:1); pen=circ.r+oy; }
    // negate: we need from circ→box, inside means push circle outward
    nx=-nx; ny=-ny;
  } else {
    if(dist>=circ.r)return null;
    pen=circ.r-dist;
    // (dx,dy) already points from circ→closest (INTO box), normalise it
    nx=dist>1e-9?dx/dist:0;
    ny=dist>1e-9?dy/dist:1;
  }

  // rotate normal back to world space
  const cosB=Math.cos(box.angle), sinB=Math.sin(box.angle);
  const wnx=cosB*nx-sinB*ny, wny=sinB*nx+cosB*ny;
  // contact point: closest point on box surface, in world space
  const cpx=box.pos.x+cosB*cx-sinB*cy;
  const cpy=box.pos.y+sinB*cx+cosB*cy;
  return{n:new Vec2(wnx,wny), pen, contacts:[new Vec2(cpx,cpy)]};
}

function detectCollision(a,b){
  if(a.type==='box'    &&b.type==='box'   )return satBoxBox(a,b);
  if(a.type==='circle' &&b.type==='circle')return circleCircle(a,b);
  if(a.type==='circle' &&b.type==='box'   )return circleBox(a,b);
  if(a.type==='box'    &&b.type==='circle'){
    const r=circleBox(b,a);
    if(r)r.n=r.n.scale(-1);   // flip: now points from box(a) → circle(b)
    return r;
  }
  return null;
}

// kept for debug-hitbox toggle (draws nothing for analytic mode)
function circleSlabs(b){ return []; }

const SLOP=0.005,BAUMGARTE=0.3,SLEEP_VEL=0.08,SLEEP_OMEGA=0.1;

function resolveCollision(a,b,mf){
  const{n,pen,contacts}=mf,totalInv=a.invMass+b.invMass;
  if(totalInv===0)return;
  const corr=n.scale(Math.max(pen-SLOP,0)/totalInv*BAUMGARTE);
  if(!a.isStatic)a.pos=a.pos.sub(corr.scale(a.invMass));
  if(!b.isStatic)b.pos=b.pos.add(corr.scale(b.invMass));
  for(const cp of contacts){
    const ra=cp.sub(a.pos),rb=cp.sub(b.pos);
    const raP=new Vec2(-ra.y,ra.x),rbP=new Vec2(-rb.y,rb.x);
    const relV=b.vel.add(rbP.scale(b.omega)).sub(a.vel).sub(raP.scale(a.omega));
    const relVn=relV.dot(n);
    if(relVn>0)continue;
    const raCN=ra.x*n.y-ra.y*n.x,rbCN=rb.x*n.y-rb.y*n.x;
    const denom=totalInv+raCN*raCN*a.invInertia+rbCN*rbCN*b.invInertia;
    const e=Math.abs(relVn)<0.5?0:restitution;
    const j=-(1+e)*relVn/(denom*contacts.length);
    const imp=n.scale(j);
    if(!a.isStatic){a.vel=a.vel.sub(imp.scale(a.invMass));a.omega-=(ra.x*imp.y-ra.y*imp.x)*a.invInertia;}
    if(!b.isStatic){b.vel=b.vel.add(imp.scale(b.invMass));b.omega+=(rb.x*imp.y-rb.y*imp.x)*b.invInertia;}
    const t=relV.sub(n.scale(relVn)).norm(),relVt=relV.dot(t);
    const ft=Math.max(-Math.abs(j)*friction,Math.min(Math.abs(j)*friction,-relVt/(denom*contacts.length)));
    const fi=t.scale(ft);
    if(!a.isStatic){a.vel=a.vel.sub(fi.scale(a.invMass));a.omega-=(ra.x*fi.y-ra.y*fi.x)*a.invInertia;}
    if(!b.isStatic){b.vel=b.vel.add(fi.scale(b.invMass));b.omega+=(rb.x*fi.y-rb.y*fi.x)*b.invInertia;}
  }
}

let lastTime=null;
function step(ts){
  if(!lastTime)lastTime=ts;
  const dt=Math.min((ts-lastTime)/1000,0.033);
  lastTime=ts;
  if(!paused){
    for(const b of bodies){
      if(b.isStatic)continue;
      b.vel.y+=gravity*dt;
      b.vel.x*=Math.pow(0.995,dt*60);
      b.pos.x+=b.vel.x*dt;
      b.pos.y+=b.vel.y*dt;
      b.angle+=b.omega*dt;
      b.omega*=Math.pow(0.99,dt*60);
    }
    // broad phase
    const pairs=[];
    for(let i=0;i<bodies.length;i++){
      for(let j=i+1;j<bodies.length;j++){
        const a=bodies[i],b=bodies[j];
        if(a.isStatic&&b.isStatic)continue;
        const ab=getAABB(a),bb=getAABB(b);
        if(ab.maxX<bb.minX||bb.maxX<ab.minX||ab.maxY<bb.minY||bb.maxY<ab.minY)continue;
        pairs.push([a,b]);
      }
    }
    // 6 solver iterations per frame
    for(let iter=0;iter<6;iter++){
      for(const[a,b]of pairs){
        const mf=detectCollision(a,b);
        if(mf)resolveCollision(a,b,mf);
      }
    }
    // velocity sleep: stop micro-jitter on resting bodies
    for(const b of bodies){
      if(b.isStatic)continue;
      if(Math.abs(b.vel.x)<0.08)b.vel.x=0;
      if(Math.abs(b.vel.y)<0.08)b.vel.y=0;
      if(Math.abs(b.omega)<0.1)b.omega=0;
    }
    const dyn=bodies.filter(b=>!b.isStatic);
    document.getElementById('cnt').textContent=dyn.length;
    if(dyn.length>80)bodies.splice(3,1);
  }
  draw();
  requestAnimationFrame(step);
}

let debugHitbox=false;
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const b of bodies){
    if(b.isStatic){
      ctx.fillStyle='#1e1e2a';
      ctx.strokeStyle='#4a4a6a';
    } else {
      ctx.fillStyle=`hsla(${b.hue},55%,55%,0.8)`;
      ctx.strokeStyle=`hsla(${b.hue},55%,35%,1)`;
    }
    ctx.lineWidth=1;
    if(b.type==='circle'){
      ctx.beginPath();
      ctx.arc(px(b.pos.x),px(b.pos.y),px(b.r),0,Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px(b.pos.x),px(b.pos.y));
      ctx.lineTo(px(b.pos.x)+Math.cos(b.angle)*px(b.r)*0.75,px(b.pos.y)+Math.sin(b.angle)*px(b.r)*0.75);
      ctx.strokeStyle=`hsla(${b.hue},55%,25%,0.6)`;
      ctx.stroke();
      // debug: draw analytic circle hitbox
      if(debugHitbox){
        ctx.beginPath();
        ctx.arc(px(b.pos.x),px(b.pos.y),px(b.r),0,Math.PI*2);
        ctx.strokeStyle='rgba(0,255,0,0.9)';
        ctx.lineWidth=1.5;
        ctx.stroke();
      }
    } else {
      ctx.save();
      ctx.translate(px(b.pos.x),px(b.pos.y));
      ctx.rotate(b.angle);
      const pw=px(b.w),ph=px(b.h);
      ctx.fillRect(-pw/2,-ph/2,pw,ph);
      ctx.strokeRect(-pw/2,-ph/2,pw,ph);
      ctx.restore();
    }
  }
}

requestAnimationFrame(step);

// drag / delete state
let dragBody=null,dragStart=null,dragOffset=null,dragMoved=false;
let deleteMode=false;

function bodyHit(b,mx,my){
  const dx=b.pos.x-mx,dy=b.pos.y-my;
  return b.type==='circle'?dx*dx+dy*dy<b.r*b.r:Math.abs(dx)<b.w/2&&Math.abs(dy)<b.h/2;
}

canvas.addEventListener('mousedown',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=mt(e.clientX-r.left),my=mt(e.clientY-r.top);
  dragStart={x:mx,y:my};
  dragMoved=false;
  // delete mode: remove the clicked body and done
  if(deleteMode){
    for(let i=3;i<bodies.length;i++){
      if(bodyHit(bodies[i],mx,my)){bodies.splice(i,1);break;}
    }
    return;
  }
  for(let i=0;i<bodies.length;i++){
    const b=bodies[i];
    if(b.isStatic&&i<3)continue; // skip boundary floor/walls
    if(bodyHit(b,mx,my)){
      dragBody=b;
      // store offset from body center so drag feels natural
      dragOffset={x:b.pos.x-mx, y:b.pos.y-my};
      break;
    }
  }
});

canvas.addEventListener('mousemove',e=>{
  if(!dragStart)return;
  const r=canvas.getBoundingClientRect();
  const mx=mt(e.clientX-r.left),my=mt(e.clientY-r.top);
  const dx=mx-dragStart.x,dy=my-dragStart.y;
  if(dx*dx+dy*dy>0.005)dragMoved=true;
  if(!dragBody)return;
  // when paused OR body is static: move directly, preserving grab offset
  if(paused||dragBody.isStatic){
    dragBody.pos.x=mx+dragOffset.x;
    dragBody.pos.y=my+dragOffset.y;
    dragBody.vel.x=0; dragBody.vel.y=0; dragBody.omega=0;
  }
});

canvas.addEventListener('mouseup',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=mt(e.clientX-r.left),my=mt(e.clientY-r.top);
  if(dragBody){
    if(!paused&&!dragBody.isStatic&&dragMoved){
      // fling dynamic body based on drag delta
      dragBody.vel.x+=(mx-dragStart.x)*8;
      dragBody.vel.y+=(my-dragStart.y)*8;
    }
  } else if(!dragMoved&&!deleteMode){
    spawnAt(mx,my);
  }
  dragBody=null; dragStart=null; dragOffset=null; dragMoved=false;
});

// shape selector buttons
document.querySelectorAll('.shape-btn').forEach(btn=>{
  btn.onclick=function(){
    document.querySelectorAll('.shape-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    selectedShape=this.dataset.shape;
    // lock height slider to width for square/circle modes
    const lockH=selectedShape==='box'||selectedShape==='circle'||selectedShape==='static-circle';
    document.getElementById('sizeH').disabled=lockH;
    if(lockH){
      document.getElementById('sizeH').value=document.getElementById('sizeW').value;
      spawnH=spawnW;
      document.getElementById('sizeH-sl').textContent=spawnW.toFixed(2);
    }
  };
});

document.getElementById('btn-spawn').onclick=()=>{
  const isStatic=selectedShape==='static-rect'||selectedShape==='static-circle';
  spawnAt(isStatic?mt(W/2):1.5+Math.random()*(mt(W)-3), isStatic?mt(H/2):0.8);
};
document.getElementById('btn-delete').onclick=function(){
  deleteMode=!deleteMode;
  this.style.color=deleteMode?'#f66':'';
  canvas.style.cursor=deleteMode?'crosshair':'crosshair';
};
document.getElementById('btn-clear').onclick=()=>bodies.splice(3);
document.getElementById('btn-pause').onclick=function(){paused=!paused;this.textContent=paused?'RESUME':'PAUSE';};
document.getElementById('btn-debug').onclick=function(){debugHitbox=!debugHitbox;this.style.color=debugHitbox?'#0f0':'';};

document.getElementById('grav').oninput=function(){
  gravity=parseFloat(this.value);
  document.getElementById('grav-out').textContent=this.value;
  document.getElementById('grav-sl').textContent=this.value;
};
document.getElementById('res').oninput=function(){
  restitution=parseFloat(this.value);
  const v=parseFloat(this.value).toFixed(2);
  document.getElementById('res-out').textContent=v;
  document.getElementById('res-sl').textContent=v;
};
document.getElementById('fric').oninput=function(){
  friction=parseFloat(this.value);
  document.getElementById('fric-sl').textContent=parseFloat(this.value).toFixed(2);
};
document.getElementById('sizeW').oninput=function(){
  spawnW=parseFloat(this.value);
  document.getElementById('sizeW-sl').textContent=spawnW.toFixed(2);
  // sync height for shapes that must stay square
  const lockH=selectedShape==='box'||selectedShape==='circle'||selectedShape==='static-circle';
  if(lockH){
    spawnH=spawnW;
    document.getElementById('sizeH').value=this.value;
    document.getElementById('sizeH-sl').textContent=spawnW.toFixed(2);
  }
};
document.getElementById('sizeH').oninput=function(){
  spawnH=parseFloat(this.value);
  document.getElementById('sizeH-sl').textContent=spawnH.toFixed(2);
};
</script>
</body>
</html>
